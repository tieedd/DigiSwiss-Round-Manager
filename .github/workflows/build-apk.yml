name: Build APK

# Simpan file ini sebagai: .github/workflows/build-apk.yml
# Proyek ini adalah proyek Android native (Kotlin + WebView) yang memuat hasil build web
# dari app/src/main/assets/dist. Jadi urutannya: build web lalu build Gradle (bukan Capacitor).

on:
  push:
    branches: [main]
    # Perubahan dokumentasi atau aturan database tidak perlu membuat APK baru
    paths-ignore:
      - '**.md'
      - 'firestore.rules'
      - 'firestore.indexes.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

env:
  # Nomor versi otomatis: 1.0.1, 1.0.2, dst. mengikuti nomor run
  APP_VERSION: 1.0.${{ github.run_number }}

jobs:
  build-apk:
    name: Bangun APK dan Rilis
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    steps:
      # 1. Ambil kode
      - name: Checkout Kode
        uses: actions/checkout@v4

      # 2. Node.js (package-lock.json tersedia, jadi cache npm aktif)
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # 3. Java 17 (syarat minimum Android Gradle Plugin 9)
      - name: Setup Java JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # 4. Pasang dependensi web
      - name: Install dependensi
        run: npm ci

      # 5. Jalankan tes logika (build berhenti jika ada tes gagal)
      - name: Jalankan tes
        run: npm test

      # 6. Samakan nomor versi di aplikasi dan di Gradle dengan nomor rilis
      - name: Atur nomor versi
        run: |
          sed -i "s/export const CURRENT_APP_VERSION = '.*';/export const CURRENT_APP_VERSION = '${APP_VERSION}';/" src/services/versionService.ts
          sed -i "s/versionCode = [0-9]*/versionCode = ${{ github.run_number }}/" app/build.gradle.kts
          sed -i "s/versionName = \".*\"/versionName = \"${APP_VERSION}\"/" app/build.gradle.kts
          grep -q "CURRENT_APP_VERSION = '${APP_VERSION}'" src/services/versionService.ts
          grep -q "versionName = \"${APP_VERSION}\"" app/build.gradle.kts
          grep -q "versionCode = ${{ github.run_number }}" app/build.gradle.kts

      # 7. Build web (hasilnya otomatis disalin ke app/src/main/assets/dist)
      - name: Build web
        run: npm run build

      - name: Pastikan hasil build web ada
        run: test -f app/src/main/assets/dist/index.html

      # 8. Terima lisensi Android SDK bawaan runner
      - name: Terima lisensi Android SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      # 9. File debug.keystore diwajibkan oleh app/build.gradle.kts tetapi tidak ada di repo.
      #    Jika secret DEBUG_KEYSTORE_BASE64 diisi, kunci tetap itu dipakai (update APK bisa menimpa versi lama).
      #    Jika tidak, dibuat kunci sementara (update harus uninstall dulu).
      - name: Siapkan keystore debug
        env:
          KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > debug.keystore
            echo "Memakai keystore tetap dari secret."
          else
            keytool -genkeypair -v -keystore debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
            echo "::warning::Keystore sementara dipakai. Isi secret DEBUG_KEYSTORE_BASE64 agar update APK tidak perlu uninstall."
          fi

      # 10. Gradle versi 9.3.1 sesuai gradle-wrapper.properties (gradlew tidak ada di repo)
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      # 11. Bangun APK debug
      - name: Bangun APK dengan Gradle
        run: gradle assembleDebug --stacktrace

      # 12. Beri nama file APK dan hitung checksum
      - name: Siapkan file APK
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk "DigiSwiss-Round-v${APP_VERSION}.apk"
          ls -lh DigiSwiss-Round-v${APP_VERSION}.apk
          echo "APK_SHA256=$(sha256sum DigiSwiss-Round-v${APP_VERSION}.apk | cut -d' ' -f1)" >> "$GITHUB_ENV"

      # 13. Cadangan sebagai artifact
      - name: Unggah artifact
        uses: actions/upload-artifact@v4
        with:
          name: digiswiss-round-apk
          path: DigiSwiss-Round-v${{ env.APP_VERSION }}.apk
          retention-days: 14

      # 14. Buat Release dan lampirkan APK
      - name: Buat GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION }}
          name: DigiSwiss-Round v${{ env.APP_VERSION }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          make_latest: true
          body: |
            APK otomatis dari commit ${{ github.sha }}.

            Cara pasang: unduh file .apk di bagian Assets, buka di HP Android,
            lalu aktifkan "Pasang dari sumber tidak dikenal" jika diminta.

            SHA-256: `${{ env.APK_SHA256 }}`
          files: DigiSwiss-Round-v${{ env.APP_VERSION }}.apk
