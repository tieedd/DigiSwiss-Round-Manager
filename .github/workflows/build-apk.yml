name: Build APK

# Simpan file ini sebagai: .github/workflows/build-apk.yml
#
# ATURAN NOMOR VERSI (format MAYOR.MINOR.PATCH, contoh 1.4.0):
#   PATCH naik (1.4.0 -> 1.4.1) : perbaikan bug atau penyempurnaan fitur (kecil)
#   MINOR naik (1.4.0 -> 1.5.0) : ada penambahan fitur, ATAU perbaikan/perubahan yang banyak
#   MAYOR naik (1.4.0 -> 2.0.0) : perubahan besar yang jarang terjadi
#
# Jenis update dibaca dari PESAN COMMIT sejak rilis terakhir:
#   fix: / improve: / refactor: / chore: / pesan lain apa pun -> PATCH
#   feat: / fitur: / mengandung [fitur] atau [minor]          -> MINOR
#   feat!: / major: / mengandung [major]                      -> MAYOR
# "Banyak" (otomatis MINOR) bila salah satu terpenuhi sejak rilis terakhir:
#   - 5 commit atau lebih berawalan fix: / perbaiki
#   - 800 baris kode atau lebih berubah, atau 25 file atau lebih berubah
#     (file kunci dependensi, dokumentasi .md, dan hasil build tidak dihitung)
#   Angka ambang ada di bagian atas skrip "Hitung nomor versi" dan bisa diubah.
# Tanda [patch] pada salah satu pesan membatalkan aturan "banyak" (tetapi tidak membatalkan feat:).
# Jika beberapa jenis muncul bersamaan, yang tertinggi dipakai (MAYOR > MINOR > PATCH).
# Untuk memaksa jenis tertentu: Actions > Build APK > Run workflow > pilih "jenis_update".

on:
  push:
    branches: [main]
    # Perubahan dokumentasi atau aturan database tidak perlu membuat APK baru
    paths-ignore:
      - '**.md'
      - 'firestore.rules'
      - 'firestore.indexes.json'
  workflow_dispatch:
    inputs:
      jenis_update:
        description: 'Jenis update (otomatis = dibaca dari pesan commit). patch: 1.4.0 -> 1.5.0, minor: 1.4.0 -> 1.5.0, major: 1.4.0 -> 2.0.0'
        type: choice
        default: otomatis
        options:
          - otomatis
          - patch
          - minor
          - major

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ------------------------------------------------------------------
  # Tahap 1: hitung nomor versi baru dari tag rilis terakhir
  # ------------------------------------------------------------------
  versi:
    name: Tentukan Nomor Versi
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.hitung.outputs.version }}
      jenis: ${{ steps.hitung.outputs.jenis }}
      alasan: ${{ steps.hitung.outputs.alasan }}
      prev_tag: ${{ steps.hitung.outputs.prev_tag }}
      skip: ${{ steps.hitung.outputs.skip }}
    steps:
      - name: Checkout Kode (dengan riwayat commit dan tag)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Hitung nomor versi
        id: hitung
        env:
          EVENT: ${{ github.event_name }}
          INPUT_JENIS: ${{ inputs.jenis_update }}
        run: |
          set -eu

          # Ambang "perbaikan banyak" (ubah angka ini bila perlu)
          BANYAK_COMMIT_FIX=5     # jumlah commit perbaikan sejak rilis terakhir
          BANYAK_BARIS=800        # jumlah baris kode yang berubah (tambah + hapus)
          BANYAK_FILE=25          # jumlah file yang berubah

          # Jika commit ini sudah punya tag rilis dan dipicu push (misalnya re-run), jangan rilis ulang
          TAG_DI_HEAD=$(git tag --points-at HEAD | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' || true)
          if [ -n "$TAG_DI_HEAD" ] && [ "$EVENT" = "push" ]; then
            echo "Commit ini sudah dirilis sebagai ${TAG_DI_HEAD}. Dilewati."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"

          # Versi rilis terakhir (hanya tag berformat vX.Y.Z)
          PREV_TAG=$(git tag --list 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n1 || true)
          JUMLAH_FILE=0; JUMLAH_BARIS=0
          if [ -n "$PREV_TAG" ]; then
            BASE="${PREV_TAG#v}"
            MSGS=$(git log "${PREV_TAG}..HEAD" --pretty=%s)
            # Ukuran perubahan (tanpa file kunci dependensi, dokumentasi, dan hasil build)
            UKURAN=$(git diff --numstat "${PREV_TAG}" HEAD -- . \
              ':(exclude)package-lock.json' ':(exclude)bun.lock' ':(exclude)*.md' \
              ':(exclude)app/src/main/assets' ':(exclude)dist' | awk '$1!="-"{f++; b+=$1+$2} END{print f+0, b+0}')
            JUMLAH_FILE=$(echo "$UKURAN" | cut -d' ' -f1)
            JUMLAH_BARIS=$(echo "$UKURAN" | cut -d' ' -f2)
          else
            BASE="1.0.0"
            MSGS=$(git log --pretty=%s)
          fi
          JUMLAH_FIX=$(printf '%s\n' "$MSGS" | grep -ciE '^(fix|hotfix|bugfix|perbaiki)(\([^)]*\))?[:! ]' || true)
          MAJOR=$(echo "$BASE" | cut -d. -f1)
          MINOR=$(echo "$BASE" | cut -d. -f2)
          PATCH=$(echo "$BASE" | cut -d. -f3)

          # Tentukan jenis update: patch (1.4.0 -> 1.4.1), minor (1.4.0 -> 1.5.0), major (1.4.0 -> 2.0.0)
          JENIS="patch"
          ALASAN="perbaikan bug atau penyempurnaan kecil"
          if [ -n "${INPUT_JENIS:-}" ] && [ "$INPUT_JENIS" != "otomatis" ]; then
            JENIS="$INPUT_JENIS"; ALASAN="dipilih manual"
          elif printf '%s\n' "$MSGS" | grep -qiE '\[major\]|^(major|breaking)|^[a-z]+(\([^)]*\))?!:'; then
            JENIS="major"; ALASAN="perubahan besar"
          elif printf '%s\n' "$MSGS" | grep -qiE '\[minor\]|^(feat|feature|fitur)(\([^)]*\))?[:!]|\[fitur\]'; then
            JENIS="minor"; ALASAN="penambahan fitur"
          elif printf '%s\n' "$MSGS" | grep -qiE '\[patch\]'; then
            JENIS="patch"; ALASAN="ditandai [patch]"
          elif [ "$JUMLAH_FIX" -ge "$BANYAK_COMMIT_FIX" ]; then
            JENIS="minor"; ALASAN="perbaikan banyak (${JUMLAH_FIX} commit perbaikan)"
          elif [ "$JUMLAH_BARIS" -ge "$BANYAK_BARIS" ] || [ "$JUMLAH_FILE" -ge "$BANYAK_FILE" ]; then
            JENIS="minor"; ALASAN="perubahan banyak (${JUMLAH_FILE} file, ${JUMLAH_BARIS} baris)"
          fi

          # Naikkan nomor versi
          case "$JENIS" in
            major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
            *)     PATCH=$((PATCH + 1)) ;;
          esac
          VERSION="${MAJOR}.${MINOR}.${PATCH}"

          if git rev-parse -q --verify "refs/tags/v${VERSION}" > /dev/null; then
            echo "::error::Tag v${VERSION} sudah ada"
            exit 1
          fi

          echo "Versi sebelumnya : ${PREV_TAG:-belum ada}"
          echo "Jenis update     : ${JENIS} (${ALASAN})"
          echo "Ukuran perubahan : ${JUMLAH_FIX} commit perbaikan, ${JUMLAH_FILE} file, ${JUMLAH_BARIS} baris"
          echo "Versi baru       : ${VERSION}"
          {
            echo "version=${VERSION}"
            echo "jenis=${JENIS}"
            echo "alasan=${ALASAN}"
            echo "prev_tag=${PREV_TAG}"
          } >> "$GITHUB_OUTPUT"

  # ------------------------------------------------------------------
  # Tahap 2: bangun APK dan buat Release
  # ------------------------------------------------------------------
  build-apk:
    name: Bangun APK dan Rilis
    needs: versi
    if: needs.versi.outputs.skip != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      APP_VERSION: ${{ needs.versi.outputs.version }}
      JENIS_UPDATE: ${{ needs.versi.outputs.jenis }}
      ALASAN_UPDATE: ${{ needs.versi.outputs.alasan }}
      PREV_TAG: ${{ needs.versi.outputs.prev_tag }}

    steps:
      # 1. Ambil kode (riwayat commit dibutuhkan untuk catatan rilis)
      - name: Checkout Kode
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Node.js 22 (tes mengimpor file .ts langsung, hanya didukung Node 22.18 ke atas)
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # 3. Java 17 (syarat minimum Android Gradle Plugin 9)
      - name: Setup Java JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # 4. Pasang dependensi web
      - name: Install dependensi
        run: npm ci

      # 5. Jalankan tes logika (build berhenti jika ada tes gagal)
      - name: Jalankan tes
        run: npm test

      # 6. Samakan nomor versi di aplikasi dan di Gradle dengan nomor rilis
      #    versionCode memakai nomor run agar SELALU naik (syarat Android untuk update)
      - name: Atur nomor versi
        run: |
          echo "Versi ${APP_VERSION} (${JENIS_UPDATE}: ${ALASAN_UPDATE}), versionCode ${{ github.run_number }}"
          sed -i "s/export const CURRENT_APP_VERSION = '.*';/export const CURRENT_APP_VERSION = '${APP_VERSION}';/" src/services/versionService.ts
          sed -i "s/versionCode = [0-9]*/versionCode = ${{ github.run_number }}/" app/build.gradle.kts
          sed -i "s/versionName = \".*\"/versionName = \"${APP_VERSION}\"/" app/build.gradle.kts
          grep -q "CURRENT_APP_VERSION = '${APP_VERSION}'" src/services/versionService.ts
          grep -q "versionName = \"${APP_VERSION}\"" app/build.gradle.kts
          grep -q "versionCode = ${{ github.run_number }}" app/build.gradle.kts

      # 7. Build web (hasilnya otomatis disalin ke app/src/main/assets/dist)
      - name: Build web
        run: npm run build

      - name: Pastikan hasil build web ada
        run: test -f app/src/main/assets/dist/index.html

      # 8. Terima lisensi Android SDK bawaan runner
      - name: Terima lisensi Android SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      # 9. Kunci tanda tangan. Isi secret DEBUG_KEYSTORE_BASE64 agar APK baru bisa menimpa versi lama tanpa uninstall.
      - name: Siapkan keystore debug
        env:
          KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > debug.keystore
            echo "Memakai keystore tetap dari secret."
          else
            keytool -genkeypair -v -keystore debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
            echo "::warning::Keystore sementara dipakai. Isi secret DEBUG_KEYSTORE_BASE64 agar update APK tidak perlu uninstall."
          fi

      # 10. Gradle 9.3.1 sesuai gradle-wrapper.properties (gradlew tidak ada di repo)
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      # 11. Bangun APK debug
      - name: Bangun APK dengan Gradle
        run: gradle assembleDebug --stacktrace

      # 12. Beri nama file APK dan hitung checksum
      - name: Siapkan file APK
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk "DigiSwiss-Round-v${APP_VERSION}.apk"
          ls -lh "DigiSwiss-Round-v${APP_VERSION}.apk"
          echo "APK_SHA256=$(sha256sum "DigiSwiss-Round-v${APP_VERSION}.apk" | cut -d' ' -f1)" >> "$GITHUB_ENV"

      # 13. Susun catatan rilis dari pesan commit sejak rilis sebelumnya
      - name: Susun catatan rilis
        run: |
          case "$JENIS_UPDATE" in
            major) LABEL="Pembaruan besar" ;;
            minor) LABEL="Penambahan fitur / perbaikan banyak" ;;
            *)     LABEL="Perbaikan bug / penyempurnaan" ;;
          esac
          {
            echo "**Jenis update:** ${LABEL} (${ALASAN_UPDATE})"
            echo
            echo "**Perubahan:**"
            if [ -n "$PREV_TAG" ]; then
              git log "${PREV_TAG}..HEAD" --pretty='- %s' | head -n 30
            else
              git log --pretty='- %s' | head -n 30
            fi
            echo
            echo "**Cara pasang:** unduh file .apk di bagian Assets, buka di HP Android,"
            echo "lalu aktifkan \"Pasang dari sumber tidak dikenal\" jika diminta."
            echo
            echo "SHA-256: \`${APK_SHA256}\`"
          } > catatan-rilis.md
          cat catatan-rilis.md

      # 14. Cadangan sebagai artifact
      - name: Unggah artifact
        uses: actions/upload-artifact@v4
        with:
          name: digiswiss-round-apk
          path: DigiSwiss-Round-v${{ env.APP_VERSION }}.apk
          retention-days: 14

      # 15. Buat Release dan lampirkan APK
      - name: Buat GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION }}
          name: DigiSwiss-Round v${{ env.APP_VERSION }}
          target_commitish: ${{ github.sha }}
          body_path: catatan-rilis.md
          make_latest: true
          files: DigiSwiss-Round-v${{ env.APP_VERSION }}.apk
