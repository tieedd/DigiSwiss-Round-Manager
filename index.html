<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0B0F14" />
    <title>DigiSwiss-Round</title>
    <script>
      (function() {
        try {
          var stored = localStorage.getItem('digiswiss-theme');
          var theme = stored;
          if (!theme) {
            theme = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
          }
          if (theme === 'light') {
            document.documentElement.setAttribute('data-theme', 'light');
            var meta = document.querySelector('meta[name="theme-color"]');
            if (meta) meta.setAttribute('content', '#F6F8FB');
          }
        } catch (e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
      /* Prevent pull-to-refresh & tap highlights */
      html, body {
        background-color: #0B0F14;
        color: #E8EDF3;
        font-family: 'Inter', system-ui, -apple-system, sans-serif;
        margin: 0;
        padding: 0;
        min-height: 100%;
        -webkit-tap-highlight-color: transparent;
        overscroll-behavior-y: none;
      }
      /* Tabular figures for numbers and scores */
      .tabular-nums {
        font-variant-numeric: tabular-nums;
      }
      /* Safe area support for notch and home bars */
      .safe-top {
        padding-top: env(safe-area-inset-top, 0px);
      }
      .safe-bottom {
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }
    </style>
  </head>
  <body class="bg-dark-bg text-dark-text antialiased selection:bg-accent/30 selection:text-dark-text">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
